name: Publicar la web y la app de Android

# On each push: run tests and build web (GitHub Pages) on one job, Android APK on another, then publish
# together: the APK lands on the same site at ./mitierrita.apk (linked from the game menu), and downloadable
# music/SFX (web/musica) at ./musica/.
# If upload key secrets exist (PLAY_UPLOAD_*, see README), also builds the Google Play AAB (./mitierrita.aab)
# without the built-in update prompt, since Google Play handles updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Prepares the commit to publish and pushes it to main when something had to change (pushes made with GITHUB_TOKEN do
  # not start a new run). The build jobs below check out that commit.
  #   - Restores the execute bit of android/gradlew when a commit drops it (AI Studio does).
  #   - Bumps the patch version when the commit did not bump it (tools/auto-version.mjs), so every publish is a new
  #     version for the web, the APK update check and Google Play (versionCode comes from the version, see
  #     android/app/build.gradle).
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          notes=()
          if ! git ls-files -s android/gradlew | grep -q '^100755'; then
            git update-index --chmod=+x android/gradlew
            notes+=("permiso de ejecución de android/gradlew")
          fi
          published=$(curl -fsS "https://frealgagu.github.io/MiTierritaGame/version.json?t=$(date +%s)" | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{try{console.log(JSON.parse(s).version??"")}catch{console.log("")}})' || true)
          echo "Published version: ${published:-none}; package.json: $(node -p 'require("./package.json").version')"
          next=$(node tools/auto-version.mjs "$published")
          if [ -n "$next" ]; then
            git add package.json package-lock.json CHANGELOG.md
            notes+=("versión $next")
          fi
          if [ ${#notes[@]} -gt 0 ]; then
            msg=$(IFS=', '; echo "${notes[*]}")
            git commit -m "Publicación automática: ${msg}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # (v4.7.3) With or without package-lock.json: changes synced from AI Studio sometimes omit it.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build
      # (v4.7.3) Give each publish its own cache key: includes commit SHA so web and app update
      # even when package.json version or public/sw.js CACHE weren't bumped.
      - run: sha="${{ needs.prepare.outputs.sha }}"; sed -i -E "s/const CACHE = '([^']+)';/const CACHE = '\1-${sha::7}';/" dist/sw.js && grep -m1 "const CACHE" dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      # Keep gradlew executable even if the prepare job could not push its fix (AI Studio drops the execute bit).
      - run: chmod +x android/gradlew
      # Debug signing key: from repo secrets (ANDROID_KEYSTORE_BASE64, ...) if set; otherwise
      # uses the temporary keystore checked into android/app (see build.gradle).
      - env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mitierrita.keystore"
            {
              echo "MITIERRITA_KEYSTORE=$RUNNER_TEMP/mitierrita.keystore"
              echo "MITIERRITA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MITIERRITA_KEY_ALIAS=$KEY_ALIAS"
              echo "MITIERRITA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      # Build game, copy assets into android/, and generate APK signed with the debug key.
      - run: |
          npm run android:apk
          cp android/app/build/outputs/apk/debug/app-debug.apk mitierrita.apk
      # AAB for Google Play, signed with upload key (only when secrets exist).
      - env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          MITIERRITA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MITIERRITA_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          MITIERRITA_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin clave de subida: no se genera el AAB."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.p12"
          export MITIERRITA_UPLOAD_KEYSTORE="$RUNNER_TEMP/subida.p12"
          PLAY_STORE=1 npm run android:sync
          (cd android && ./gradlew bundleRelease)
          cp android/app/build/outputs/bundle/release/app-release.aab mitierrita.aab
          rm "$RUNNER_TEMP/subida.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mitierrita.a*

  deploy:
    needs: [prepare, web, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Web-only downloads excluded from the mobile app (v3.71): music and SFX (web/musica),
      # bundled into a single .zip archive.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: web
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: site
      - run: |
          cp -r web/. site/
          (cd site/musica && zip -q -r encantos-de-mi-tierrita-musica.zip . -i '*.mp3' '*.mid')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
