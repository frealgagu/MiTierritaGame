name: Publicar la web y la app de Android

# En cada push: pruebas y web (GitHub Pages) por un lado, APK de Android por otro, y al final se
# publican juntos: el APK queda en la misma página, en ./mitierrita.apk (el menú del juego lo enlaza), y la
# música y los sonidos para descargar (web/musica) en ./musica/.
# Si existen los secretos de la clave de subida (PLAY_UPLOAD_*, ver el README), también se genera el
# AAB para Google Play (./mitierrita.aab): sin el aviso de actualización propio, porque Play actualiza solo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # (v4.7.3) Con o sin package-lock.json: los cambios que llegan de AI Studio a veces no lo traen.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build
      # (v4.7.3) Cada publicación con su propio caché: el nombre lleva el commit, así la web y la app se actualizan
      # aunque no se haya subido la versión ni el CACHE de public/sw.js.
      - run: sed -i -E "s/const CACHE = '([^']+)';/const CACHE = '\1-${GITHUB_SHA::7}';/" dist/sw.js && grep -m1 "const CACHE" dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      # (v4.7.3) gradlew siempre ejecutable (desde AI Studio llegó sin el permiso y el APK no se armaba), y el código de
      # versión de Android sale del número de esta publicación: siempre sube, así Google Play acepta el AAB aunque la
      # versión de package.json no haya cambiado (ver android/app/build.gradle).
      - run: |
          chmod +x android/gradlew
          echo "MITIERRITA_VERSION_CODE=$((50000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      # Clave de pruebas: de los secretos del repositorio (ANDROID_KEYSTORE_BASE64, …) si existen; si no,
      # la que está temporalmente en android/app (ver build.gradle).
      - env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mitierrita.keystore"
            {
              echo "MITIERRITA_KEYSTORE=$RUNNER_TEMP/mitierrita.keystore"
              echo "MITIERRITA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MITIERRITA_KEY_ALIAS=$KEY_ALIAS"
              echo "MITIERRITA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      # Compila el juego, lo copia a android/ y genera el APK firmado con la clave de pruebas.
      - run: |
          npm run android:apk
          cp android/app/build/outputs/apk/debug/app-debug.apk mitierrita.apk
      # AAB para Google Play, firmado con la clave de subida (solo si están los secretos).
      - env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          MITIERRITA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MITIERRITA_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          MITIERRITA_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin clave de subida: no se genera el AAB."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.p12"
          export MITIERRITA_UPLOAD_KEYSTORE="$RUNNER_TEMP/subida.p12"
          PLAY_STORE=1 npm run android:sync
          (cd android && ./gradlew bundleRelease)
          cp android/app/build/outputs/bundle/release/app-release.aab mitierrita.aab
          rm "$RUNNER_TEMP/subida.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mitierrita.a*

  deploy:
    needs: [web, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Lo que va solo en la página y no en la app (v3.71): la música y los sonidos para descargar (web/musica),
      # con un .zip de todo.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: site
      - run: |
          cp -r web/. site/
          (cd site/musica && zip -q -r encantos-de-mi-tierrita-musica.zip . -i '*.mp3' '*.mid')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
