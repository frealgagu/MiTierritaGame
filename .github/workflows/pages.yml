name: Publicar la web y la app de Android

# On each push: run tests and build web (GitHub Pages) on one job, Android APK on another, then publish
# together: the APK lands on the same site at ./mitierrita.apk (linked from the game menu), and downloadable
# music/SFX (web/musica) at ./musica/.
# If upload key secrets exist (PLAY_UPLOAD_*, see README), also builds the Google Play AAB (./mitierrita.aab)
# without the built-in update prompt, since Google Play handles updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # (v4.7.3) With or without package-lock.json: changes synced from AI Studio sometimes omit it.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build
      # (v4.7.3) Give each publish its own cache key: includes commit SHA so web and app update
      # even when package.json version or public/sw.js CACHE weren't bumped.
      - run: sed -i -E "s/const CACHE = '([^']+)';/const CACHE = '\1-${GITHUB_SHA::7}';/" dist/sw.js && grep -m1 "const CACHE" dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      # (v4.7.3) Keep gradlew executable (AI Studio drops execute permission, breaking APK builds), and derive
      # Android versionCode from the run number so it always increments and Google Play accepts the AAB even
      # if package.json version didn't change (see android/app/build.gradle).
      - run: |
          chmod +x android/gradlew
          echo "MITIERRITA_VERSION_CODE=$((50000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      # Debug signing key: from repo secrets (ANDROID_KEYSTORE_BASE64, ...) if set; otherwise
      # uses the temporary keystore checked into android/app (see build.gradle).
      - env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mitierrita.keystore"
            {
              echo "MITIERRITA_KEYSTORE=$RUNNER_TEMP/mitierrita.keystore"
              echo "MITIERRITA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MITIERRITA_KEY_ALIAS=$KEY_ALIAS"
              echo "MITIERRITA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      # Build game, copy assets into android/, and generate APK signed with the debug key.
      - run: |
          npm run android:apk
          cp android/app/build/outputs/apk/debug/app-debug.apk mitierrita.apk
      # AAB for Google Play, signed with upload key (only when secrets exist).
      - env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          MITIERRITA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MITIERRITA_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          MITIERRITA_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin clave de subida: no se genera el AAB."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.p12"
          export MITIERRITA_UPLOAD_KEYSTORE="$RUNNER_TEMP/subida.p12"
          PLAY_STORE=1 npm run android:sync
          (cd android && ./gradlew bundleRelease)
          cp android/app/build/outputs/bundle/release/app-release.aab mitierrita.aab
          rm "$RUNNER_TEMP/subida.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mitierrita.a*

  deploy:
    needs: [web, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Web-only downloads excluded from the mobile app (v3.71): music and SFX (web/musica),
      # bundled into a single .zip archive.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: site
      - run: |
          cp -r web/. site/
          (cd site/musica && zip -q -r encantos-de-mi-tierrita-musica.zip . -i '*.mp3' '*.mid')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
