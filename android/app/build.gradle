apply plugin: 'com.android.application'

// Version comes from package.json: versionName "1.7.2", versionCode 10702 (major*10000 + minor*100 + patch).
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (major, minor, patch) = pkg.version.tokenize('.').collect { it as int }

android {
    namespace = "com.frealgagu.mitierrita.encantos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.frealgagu.mitierrita.encantos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // (v4.7.3) In GitHub Actions, the publish workflow supplies the code (50000 + run number): always increments even if
        // package.json version hasn't changed (Google Play rejects duplicate version codes).
        // (With «=» and parentheses: without them Groovy parsed versionCode(...) and then `as int` of null.)
        versionCode = (System.getenv('MITIERRITA_VERSION_CODE') ?: "${major * 10000 + minor * 100 + patch}").toInteger()
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Debug signing key: every APK shares the same signature so updates install over previous ones
    // without losing save data. Supplied via env vars (from repo secrets in GitHub Actions; see
    // .github/workflows/pages.yml). Until secrets exist, falls back to the repo's debug keystore (temporary).
    def keystore = System.getenv('MITIERRITA_KEYSTORE') ?: (file('mitierrita-pruebas.keystore').exists() ? 'mitierrita-pruebas.keystore' : null)
    def fromEnv = System.getenv('MITIERRITA_KEYSTORE') != null
    if (keystore) {
        signingConfigs {
            pruebas {
                storeFile file(keystore)
                storePassword fromEnv ? System.getenv('MITIERRITA_KEYSTORE_PASSWORD') : 'android'
                keyAlias fromEnv ? System.getenv('MITIERRITA_KEY_ALIAS') : 'androiddebugkey'
                keyPassword fromEnv ? System.getenv('MITIERRITA_KEY_PASSWORD') : 'android'
            }
        }
    }
    // Google Play upload key (for store AAB): supplied only via env vars from PLAY_UPLOAD_* repo
    // secrets. Google re-signs with its own key afterward (Play App Signing).
    def uploadKeystore = System.getenv('MITIERRITA_UPLOAD_KEYSTORE')
    if (uploadKeystore) {
        signingConfigs {
            subida {
                storeFile file(uploadKeystore)
                storePassword System.getenv('MITIERRITA_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MITIERRITA_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('MITIERRITA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (keystore) signingConfig signingConfigs.pruebas
        }
        release {
            if (uploadKeystore) signingConfig signingConfigs.subida
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
